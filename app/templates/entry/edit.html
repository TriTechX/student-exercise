{%- extends "base.html" -%}

{%- block beforeContent -%}
{{ super() }}
{%- endblock -%}

{%- block content -%}
<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    {{ super() }}
    <form method="post" action="{{ url_for('register.entry.edit', entry_id=entry.id, register_id=register_id) }}" novalidate>
        {{ form.csrf_token}}
        {{ form.name(params={
            'spellcheck': true
        }) }}
        <div class="govuk-button-group">
            {{ form.submit(params={
            'preventDoubleClick': true
            }) }}
            <a class="govuk-link" href="{{ url_for('register.entry.view', entry_id=entry.id, register_id=register_id) }}">Cancel</a>
        </div>
    </form>
  </div>
</div>
{%- endblock -%}
